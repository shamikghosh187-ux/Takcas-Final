<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takcas Prime: Multi-Assistant</title>
    <style>
        :root {
            color-scheme: dark;
            --bg-color: #090b12;
            --panel-bg: rgba(17, 21, 33, 0.88);
            --text-color: #e8edf7;
            --muted: #8e9ab0;
            --accent: #a78bfa;
            --accent-strong: #8b5cf6;
            --user-bg: #5140a8;
            --bot-bg: #151b2a;
            --line: rgba(160, 174, 205, 0.14);
            --shadow: 0 18px 55px rgba(0, 0, 0, 0.28);
        }

        * { box-sizing: border-box; }

        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(900px 500px at 12% -12%, rgba(124, 91, 230, 0.19), transparent 62%),
                radial-gradient(700px 420px at 100% 5%, rgba(44, 116, 190, 0.12), transparent 58%),
                var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
        }

        header {
            flex: 0 0 auto;
            min-height: 76px;
            padding: 16px clamp(18px, 4vw, 54px);
            background: rgba(10, 13, 22, 0.82);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            z-index: 2;
        }

        h1 {
            margin: 0;
            color: #f4f1ff;
            font-size: clamp(19px, 2.2vw, 25px);
            font-weight: 750;
            letter-spacing: -0.045em;
        }

        h1::before {
            content: "";
            display: inline-block;
            width: 9px;
            height: 9px;
            margin: 0 11px 3px 1px;
            border-radius: 3px;
            background: linear-gradient(135deg, #c4b5fd, #7c3aed);
            box-shadow: 0 0 18px rgba(167, 139, 250, 0.75);
            transform: rotate(45deg);
        }

        button, textarea { font: inherit; }

        button:focus-visible, textarea:focus-visible {
            outline: 2px solid #c4b5fd;
            outline-offset: 3px;
        }

        .lang-btn {
            background: rgba(167, 139, 250, 0.09);
            border: 1px solid rgba(167, 139, 250, 0.42);
            color: #d9ccff;
            padding: 9px 15px;
            min-width: 54px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.08em;
            transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
        }

        .lang-btn:hover {
            background: rgba(167, 139, 250, 0.17);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .personas-bar {
            flex: 0 0 auto;
            display: flex;
            gap: 10px;
            padding: 15px clamp(16px, 4vw, 54px);
            overflow-x: auto;
            background: rgba(12, 15, 24, 0.72);
            border-bottom: 1px solid var(--line);
            scrollbar-width: thin;
            scrollbar-color: rgba(167, 139, 250, 0.35) transparent;
        }

        .persona-btn {
            flex: 0 0 auto;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid var(--line);
            color: #aeb9cc;
            padding: 10px 16px;
            border-radius: 13px;
            cursor: pointer;
            transition: color 180ms ease, background 180ms ease, border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 650;
        }

        .persona-btn:hover {
            color: #f2edff;
            border-color: rgba(167, 139, 250, 0.48);
            background: rgba(167, 139, 250, 0.08);
            transform: translateY(-1px);
        }

        .persona-btn.active {
            color: #eee8ff;
            border-color: rgba(167, 139, 250, 0.72);
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.23), rgba(99, 102, 241, 0.10));
            box-shadow: inset 0 0 0 1px rgba(196, 181, 253, 0.08), 0 5px 20px rgba(91, 61, 180, 0.13);
        }

        #chat-box {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            padding: 28px clamp(16px, 8vw, 120px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 19px;
            scroll-behavior: smooth;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: rgba(167, 139, 250, 0.3) transparent;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: min(82%, 820px);
            position: relative;
        }

        .message {
            padding: 14px 17px;
            border: 1px solid var(--line);
            border-radius: 18px;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            line-height: 1.68;
            font-size: 14px;
            animation: fadeIn 0.24s ease;
            white-space: pre-wrap;
            box-shadow: 0 7px 24px rgba(0, 0, 0, 0.12);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(7px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg-wrapper { align-self: flex-end; align-items: flex-end; }
        .bot-msg-wrapper { align-self: flex-start; align-items: flex-start; }

        .user-msg {
            color: #fff;
            background: linear-gradient(145deg, #6550c8, #49349f);
            border-color: rgba(196, 181, 253, 0.22);
            border-bottom-right-radius: 6px;
        }

        .bot-msg {
            color: #e2e8f4;
            background: linear-gradient(145deg, rgba(24, 31, 48, 0.98), rgba(17, 23, 37, 0.98));
            border-color: rgba(148, 163, 184, 0.15);
            border-left: 3px solid var(--accent);
            border-bottom-left-radius: 6px;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 11px;
            margin-top: 6px;
            padding: 5px 8px;
            border-radius: 8px;
            opacity: 0.78;
            transition: color 180ms ease, background 180ms ease, border-color 180ms ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .copy-btn:hover {
            opacity: 1;
            color: #d9ccff;
            background: rgba(167, 139, 250, 0.08);
            border-color: rgba(167, 139, 250, 0.2);
        }

        .loading { display: flex; gap: 5px; align-items: center; height: 20px; }
        .dot {
            width: 7px;
            height: 7px;
            background: #b9a5ff;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.45; }
            40% { transform: scale(1); opacity: 1; }
        }

        .input-area {
            flex: 0 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 11px;
            padding: 16px clamp(16px, 8vw, 120px) max(16px, env(safe-area-inset-bottom));
            background: rgba(12, 16, 26, 0.92);
            border-top: 1px solid var(--line);
            box-shadow: 0 -14px 38px rgba(0, 0, 0, 0.16);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        textarea {
            flex: 1;
            min-width: 0;
            padding: 13px 16px;
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: rgba(7, 10, 18, 0.92);
            color: var(--text-color);
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            height: 46px;
            min-height: 46px;
            max-height: 120px;
            transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
        }

        textarea::placeholder { color: #758198; }

        textarea:focus {
            outline: none;
            border-color: rgba(167, 139, 250, 0.72);
            background: #0b0f1b;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.12);
        }

        button.send-btn {
            flex: 0 0 46px;
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, #c4b5fd, #8b5cf6);
            color: #171025;
            border: 1px solid rgba(221, 214, 254, 0.35);
            border-radius: 14px;
            padding: 0;
            font-size: 19px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 7px 20px rgba(124, 58, 237, 0.24);
            transition: transform 180ms ease, filter 180ms ease, opacity 180ms ease;
        }

        button.send-btn:hover:not(:disabled) {
            filter: brightness(1.08);
            transform: translateY(-2px);
        }

        button.send-btn:active:not(:disabled) { transform: translateY(0); }
        button.send-btn:disabled { cursor: wait; filter: saturate(0.65); }

        @media (min-width: 1200px) {
            #chat-box { padding-left: max(120px, calc((100vw - 1050px) / 2)); padding-right: max(120px, calc((100vw - 1050px) / 2)); }
            .input-area { padding-left: max(120px, calc((100vw - 1050px) / 2)); padding-right: max(120px, calc((100vw - 1050px) / 2)); }
        }

        @media (max-width: 640px) {
            header { min-height: 64px; padding: 12px 16px; }
            .personas-bar { gap: 8px; padding: 11px 13px; }
            .persona-btn { padding: 9px 12px; font-size: 12px; border-radius: 11px; }
            #chat-box { padding: 18px 13px; gap: 14px; }
            .message-wrapper { max-width: 94%; }
            .message { padding: 12px 14px; font-size: 13px; border-radius: 15px; }
            .input-area { gap: 8px; padding: 11px 12px max(12px, env(safe-area-inset-bottom)); }
            textarea { height: 44px; min-height: 44px; padding: 11px 13px; font-size: 14px; }
            button.send-btn { flex-basis: 44px; width: 44px; height: 44px; border-radius: 13px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
</style>
</head>
<body>
    <header>
        <h1>Takcas Prime</h1>
        <button class="lang-btn" id="lang-toggle" onclick="toggleLang()">EN</button>
    </header>
    
    <div class="personas-bar" id="personas-bar">
        <button class="persona-btn active" data-persona="taksas" id="btn-taksas">🕵️‍♂️ Таксас</button>
        <button class="persona-btn" data-persona="dubina" id="btn-dubina">🪵 Дубина</button>
        <button class="persona-btn" data-persona="prokrastinator" id="btn-prokrastinator">🦥 Прокрастинатор</button>
        <button class="persona-btn" data-persona="potassium" id="btn-potassium">🥔 Потассиум</button>
        <button class="persona-btn" data-persona="coder" id="btn-coder">💻 Кодер</button>
    </div>
    
    <div id="chat-box"></div>
    
    <div class="input-area">
        <textarea id="user-input" placeholder="Напиши сообщение..." rows="1"></textarea>
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('user-input');
        const personasBar = document.getElementById('personas-bar');
        const sendButton = document.querySelector('.send-btn');
        let currentPersona = 'taksas';
        let currentLang = 'ru';
        let isSending = false;

        const translations = {
            ru: { placeholder: "Напиши сообщение...", taksas: "🕵️‍♂️ Таксас", dubina: "🪵 Дубина", prokrastinator: "🦥 Прокрастинатор", potassium: "🥔 Потассиум", coder: "💻 Кодер", copy: "Копировать", copied: "Скопировано!", connection: "Ошибка соединения с сервером.", generic: "Не удалось получить ответ." },
            en: { placeholder: "Type a message...", taksas: "🕵️‍♂️ Takcas", dubina: "🪵 Dubina", prokrastinator: "🦥 Procrastinator", potassium: "🥔 Potassium", coder: "💻 Coder", copy: "Copy", copied: "Copied!", connection: "Connection error. Please try again.", generic: "Could not get a response." }
        };

        function toggleLang() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            document.getElementById('lang-toggle').innerText = currentLang === 'ru' ? 'EN' : 'RU';
            input.placeholder = translations[currentLang].placeholder;
            document.getElementById('btn-taksas').innerText = translations[currentLang].taksas;
            document.getElementById('btn-dubina').innerText = translations[currentLang].dubina;
            document.getElementById('btn-prokrastinator').innerText = translations[currentLang].prokrastinator;
            document.getElementById('btn-potassium').innerText = translations[currentLang].potassium;
            document.getElementById('btn-coder').innerText = translations[currentLang].coder;
            renderHistory();
        }

        function getHistoryKey(persona = currentPersona) {
            return `chat_history_${persona}`;
        }

        function normalizeHistory(value) {
            if (!Array.isArray(value)) return [];
            return value
                .filter(item => item && typeof item === 'object'
                    && (item.role === 'user' || item.role === 'assistant')
                    && typeof item.content === 'string'
                    && item.content.trim().length > 0)
                .slice(-100)
                .map(item => ({ role: item.role, content: item.content.slice(0, 12000) }));
        }

        function loadHistory(persona = currentPersona) {
            try {
                const raw = localStorage.getItem(getHistoryKey(persona));
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                const history = normalizeHistory(parsed);
                // Repair invalid or outdated stored data instead of crashing the UI.
                if (!Array.isArray(parsed) || history.length !== parsed.length) {
                    saveHistory(history, persona);
                }
                return history;
            } catch (error) {
                console.warn('Unable to read chat history; starting with an empty history.', error);
                try { localStorage.removeItem(getHistoryKey(persona)); } catch (_) {}
                return [];
            }
        }

        function saveHistory(history, persona = currentPersona) {
            const safeHistory = normalizeHistory(history);
            try {
                localStorage.setItem(getHistoryKey(persona), JSON.stringify(safeHistory));
                return true;
            } catch (error) {
                console.warn('Unable to save chat history.', error);
                return false;
            }
        }

        function renderHistory() {
            chatBox.innerHTML = '';
            loadHistory().forEach(msg => addMessageToUI(msg.content, msg.role === 'user' ? 'user' : 'bot', false));
        }

        personasBar.addEventListener('click', (event) => {
            const button = event.target.closest('.persona-btn');
            if (!button || !personasBar.contains(button)) return;
            document.querySelectorAll('.persona-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            currentPersona = button.dataset.persona;
            renderHistory();
        });

        input.addEventListener('input', function() {
            this.style.height = '20px';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        function addMessageToUI(text, sender, animate = true) {
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${sender === 'user' ? 'user-msg-wrapper' : 'bot-msg-wrapper'}`;
            const div = document.createElement('div');
            div.className = `message ${sender === 'user' ? 'user-msg' : 'bot-msg'}`;
            if (!animate) div.style.animation = 'none';
            div.innerText = text;
            wrapper.appendChild(div);

            if (sender === 'bot') {
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.type = 'button';
                copyBtn.innerText = '📋 ' + translations[currentLang].copy;
                copyBtn.onclick = async () => {
                    try {
                        await navigator.clipboard.writeText(text);
                        copyBtn.innerText = '✅ ' + translations[currentLang].copied;
                    } catch (error) {
                        copyBtn.innerText = translations[currentLang].copy;
                        console.warn('Clipboard access failed.', error);
                    }
                };
                wrapper.appendChild(copyBtn);
            }

            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
            return wrapper;
        }

        function setSending(sending) {
            isSending = sending;
            sendButton.disabled = sending;
            sendButton.setAttribute('aria-busy', String(sending));
            sendButton.style.opacity = sending ? '0.6' : '1';
            input.disabled = sending;
        }

        async function sendMessage() {
            if (isSending) return;
            const text = input.value.trim();
            if (!text) return;

            // Capture the active conversation before awaiting the network.
            const persona = currentPersona;
            const lang = currentLang;
            const history = loadHistory(persona);
            history.push({ role: 'user', content: text });
            saveHistory(history, persona);
            addMessageToUI(text, 'user');

            input.value = '';
            input.style.height = '20px';
            setSending(true);

            const loadingWrapper = document.createElement('div');
            loadingWrapper.className = 'message-wrapper bot-msg-wrapper';
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot-msg';
            loadingDiv.innerHTML = '<div class="loading" aria-label="Loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
            loadingWrapper.appendChild(loadingDiv);
            chatBox.appendChild(loadingWrapper);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ persona, message: text, history, lang })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(data.error || `Request failed (${response.status}).`);
                }
                if (typeof data.response !== 'string' || !data.response.trim()) {
                    throw new Error(data.error || translations[lang].generic);
                }

                const updatedHistory = loadHistory(persona);
                updatedHistory.push({ role: 'assistant', content: data.response.trim() });
                saveHistory(updatedHistory, persona);
                if (currentPersona === persona) {
                    addMessageToUI(data.response.trim(), 'bot');
                }
            } catch (error) {
                console.error('Chat request failed:', error);
                const message = error instanceof Error ? error.message : translations[lang].connection;
                const updatedHistory = loadHistory(persona);
                updatedHistory.push({ role: 'assistant', content: 'Error: ' + message });
                saveHistory(updatedHistory, persona);
                if (currentPersona === persona) addMessageToUI('Error: ' + message, 'bot');
            } finally {
                loadingWrapper.remove();
                setSending(false);
                input.focus();
            }
        }

        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        renderHistory();
    </script>
</body>
</html>
